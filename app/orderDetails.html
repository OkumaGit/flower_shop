<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css"
    />
    <script type="module" src="./script.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>

    <link rel="stylesheet" type="text/css" href="./styles.css" />
  </head>
  <body class="orderDetails">
    <header>
      <div class="navbar-fixed">
        <nav class="navbar">
          <div class="nav-wrapper">
            <div
              style="
                padding: 0 16px;
                display: flex;
                justify-content: space-between;
              "
              class="nav-content"
            >
              <ul>
                <li
                  class="logo-container"
                  style="
                    border: none;
                    margin-bottom: 20px;
                    align-items: center;
                    gap: 10px;
                    justify-content: space-between;
                    color: #fff;
                  "
                >
                  <i class="material-icons left">spa</i>
                  <a
                    href="./index.html"
                    class="brand-logo"
                    style="
                      font-size: 2.1rem;
                      padding: 0;
                      font-weight: 400;
                      color: #fff;
                    "
                    >Flower delivery</a
                  >
                </li>
              </ul>
              <ul id="">
                <li style="display: flex; width: 100%">
                  <a
                    style="display: flex; gap: 10px"
                    class="waves-effect"
                    href="./shoppingCart.html"
                    ><span id="cartNumber">0</span
                    ><i class="material-icons">shopping_cart</i
                    ><span class="hide-on-med-and-down">Cart</span></a
                  >
                </li>
              </ul>
            </div>
          </div>
        </nav>
      </div>
    </header>
    <main style="padding: 0">
      <div class="container">
        <div class="row">
          <div class="">
            <div
              id="fromContactForm"
              class="col s12 m12"
              style="
                border: 1px solid #e4e4e4;
                display: flex;
                flex-direction: column;
              "
            >
              <div class="col s12 m12" style="flex-shrink: 0">
                <h5 class="section-title">Order details</h5>
                <h6>Thank you, your order is successfully confirmed!</h6>
              </div>
            </div>
            <div
              id="orderedProducts"
              class="col s12 m12"
              style="border: 1px solid #e4e4e4; overflow: scroll"
            >
              <!-- Products are inserted here -->
            </div>
          </div>
        </div>
        <!-- <hr
          style="border: none; border-top: 1px solid #e4e4e4; margin: 20px 0"
        /> -->
      </div>
    </main>
  </body>
</html>
